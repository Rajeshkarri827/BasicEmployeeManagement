<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System Version-2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Employee Management System</h1>

        <!-- Employee Form -->
        <div class="form-container">

            <h2>Add Employee</h2>

            <form id="employeeForm">

                <input
                    type="text"
                    id="employeeId"
                    placeholder="Employee ID"
                    required
                >

                <input
                    type="text"
                    id="name"
                    placeholder="Employee Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department"
                    required
                >

                <input
                    type="text"
                    id="role"
                    placeholder="Role"
                    required
                >

                <button type="submit" id="submitBtn">
                    Add Employee
                </button>

            </form>

        </div>


        <!-- Search -->
        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search employees..."
            >

        </div>


        <!-- Employee Table -->
        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="employeeTable">

                </tbody>

            </table>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
